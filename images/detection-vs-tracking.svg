<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <rect width="1200" height="500" fill="#f8fbfc"/>
  <style>.h{font:700 28px Arial;fill:#17324d}.t{font:20px Arial;fill:#3d5262}.id{font:700 20px Arial;fill:#b83a3a}.box{fill:none;stroke:#1b7f79;stroke-width:5}.pet{font:56px Arial}</style>
  <text class="h" x="300" y="55" text-anchor="middle">Object Detection</text><text class="h" x="900" y="55" text-anchor="middle">Object Tracking</text>
  <g transform="translate(65 100)"><rect x="0" y="0" width="470" height="300" rx="18" fill="#e6eef2"/><text class="pet" x="90" y="160">🐕</text><rect class="box" x="55" y="85" width="150" height="140"/><text class="t" x="75" y="260">Frame 1: dog</text><text class="pet" x="310" y="150">🐕</text><rect class="box" x="280" y="75" width="150" height="140"/><text class="t" x="295" y="260">Frame 2: dog</text></g>
  <g transform="translate(665 100)"><rect x="0" y="0" width="470" height="300" rx="18" fill="#e6eef2"/><text class="pet" x="90" y="160">🐕</text><rect class="box" x="55" y="85" width="150" height="140"/><text class="id" x="70" y="75">ID #3</text><path d="M205 155 C250 120, 270 120, 310 145" fill="none" stroke="#244b6e" stroke-width="5" stroke-dasharray="10 8"/><text class="pet" x="310" y="150">🐕</text><rect class="box" x="280" y="75" width="150" height="140"/><text class="id" x="295" y="65">ID #3</text></g>
  <text class="t" x="300" y="450" text-anchor="middle">Each frame has a detection, but no memory.</text><text class="t" x="900" y="450" text-anchor="middle">The same pet keeps an identity across frames.</text>
</svg>
