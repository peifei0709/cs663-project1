<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <rect width="1200" height="480" fill="#f8fbfc"/>
  <style>.h{font:700 26px Arial;fill:#17324d}.t{font:18px Arial;fill:#405565}.b{fill:#fff;stroke:#1b7f79;stroke-width:3}.a{stroke:#244b6e;stroke-width:4;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244b6e"/></marker></defs>
  <text class="h" x="600" y="45" text-anchor="middle">Behavior Recognition Needs Temporal Information</text>
  <g transform="translate(45 100)"><rect class="b" x="0" y="0" rx="15" width="210" height="120"/><text class="h" x="105" y="48" text-anchor="middle">Video Clip</text><text class="t" x="105" y="82" text-anchor="middle">multiple frames</text></g>
  <g transform="translate(310 100)"><rect class="b" x="0" y="0" rx="15" width="230" height="120"/><text class="h" x="115" y="48" text-anchor="middle">Visual Features</text><text class="t" x="115" y="82" text-anchor="middle">CNN / EfficientNet</text></g>
  <g transform="translate(595 100)"><rect class="b" x="0" y="0" rx="15" width="230" height="120"/><text class="h" x="115" y="48" text-anchor="middle">Time Features</text><text class="t" x="115" y="82" text-anchor="middle">LSTM / temporal model</text></g>
  <g transform="translate(880 100)"><rect class="b" x="0" y="0" rx="15" width="270" height="120"/><text class="h" x="135" y="48" text-anchor="middle">Behavior Label</text><text class="t" x="135" y="82" text-anchor="middle">walk / sit / lie / run</text></g>
  <line class="a" x1="255" y1="160" x2="310" y2="160"/><line class="a" x1="540" y1="160" x2="595" y2="160"/><line class="a" x1="825" y1="160" x2="880" y2="160"/>
  <rect x="225" y="300" width="750" height="90" rx="18" fill="#e8f5f3" stroke="#1b7f79" stroke-width="2"/>
  <text class="t" x="600" y="335" text-anchor="middle">Why not YOLO alone?</text><text class="t" x="600" y="368" text-anchor="middle">YOLO localizes objects in frames; behavior often depends on motion and change across time.</text>
</svg>
