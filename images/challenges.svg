<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540">
  <rect width="1200" height="540" fill="#f8fbfc"/>
  <style>.h{font:700 28px Arial;fill:#17324d}.t{font:18px Arial;fill:#405565}.c{fill:#fff;stroke:#d4e0e7;stroke-width:3}</style>
  <text class="h" x="600" y="55" text-anchor="middle">Common Failure Cases in Home Pet Monitoring</text>
  <g transform="translate(80 100)"><rect class="c" width="300" height="150" rx="18"/><text x="150" y="62" font-size="48" text-anchor="middle">🌙</text><text class="h" x="150" y="103" text-anchor="middle">Poor lighting</text><text class="t" x="150" y="132" text-anchor="middle">lower confidence</text></g>
  <g transform="translate(450 100)"><rect class="c" width="300" height="150" rx="18"/><text x="150" y="62" font-size="48" text-anchor="middle">🪑</text><text class="h" x="150" y="103" text-anchor="middle">Occlusion</text><text class="t" x="150" y="132" text-anchor="middle">pet partly hidden</text></g>
  <g transform="translate(820 100)"><rect class="c" width="300" height="150" rx="18"/><text x="150" y="62" font-size="48" text-anchor="middle">💨</text><text class="h" x="150" y="103" text-anchor="middle">Fast motion</text><text class="t" x="150" y="132" text-anchor="middle">blur and missed tracks</text></g>
  <g transform="translate(260 310)"><rect class="c" width="300" height="150" rx="18"/><text x="150" y="62" font-size="48" text-anchor="middle">🐕🐕</text><text class="h" x="150" y="103" text-anchor="middle">Multiple pets</text><text class="t" x="150" y="132" text-anchor="middle">identity switches</text></g>
  <g transform="translate(640 310)"><rect class="c" width="300" height="150" rx="18"/><text x="150" y="62" font-size="48" text-anchor="middle">📷</text><text class="h" x="150" y="103" text-anchor="middle">Camera angle</text><text class="t" x="150" y="132" text-anchor="middle">appearance changes</text></g>
</svg>
